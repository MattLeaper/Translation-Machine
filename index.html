<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Translate text between English, Spanish, French, German, Italian and Romanian, entirely in your browser." />
  <title>Matt's Translator</title>
  <script>
    (function () {
      var t; try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Matt's Translator</h1>
      <button id="themeToggle" type="button"></button>
    </header>
    <p class="lede">Translates in your browser, so your text never leaves your device. The first translation for each language downloads a small model (about 100 MB), then it's cached.</p>

    <div class="panels">
      <section class="panel" aria-label="Original text">
        <select id="src" aria-label="Translate from"></select>
        <textarea id="input" placeholder="Type or paste text" maxlength="2000"></textarea>
        <div class="tools">
          <button id="mic" type="button" class="icon" aria-label="Speak your text">🎤</button>
          <button id="clear" type="button" class="icon" aria-label="Clear text">✕</button>
        </div>
      </section>

      <button id="swap" type="button" class="icon swap" aria-label="Swap languages">⇄</button>

      <section class="panel" aria-label="Translation">
        <select id="tgt" aria-label="Translate to"></select>
        <textarea id="output" placeholder="Translation appears here" readonly></textarea>
        <div class="tools">
          <button id="speak" type="button" class="icon" aria-label="Read aloud">🔊</button>
          <button id="copy" type="button" class="icon" aria-label="Copy translation">⧉</button>
        </div>
      </section>
    </div>

    <div class="actions">
      <button id="translate" type="button" class="primary">Translate</button>
      <button id="define" type="button" class="secondary">Define a word</button>
    </div>
    <progress id="bar" max="100" value="0" hidden></progress>
    <p id="status" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
